services:
  db:
    image: postgres:16
    container_name: learnwell_course_management-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: LearnWellDB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - learnwell-network

  seq:
    image: datalust/seq:latest
    container_name: learnwell_course_management-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      SEQ_FSPATH: "/seq"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/seq
    networks:
      - learnwell-network

