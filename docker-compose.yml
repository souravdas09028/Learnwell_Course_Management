version: "3.9"

services:
  db:
    image: postgres:16
    container_name: learnwell_course_management-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MyStrongPassword123
      POSTGRES_DB: LearnWellDB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - learnwell-network

  seq:
    image: datalust/seq:latest
    container_name: learnwell_course_management-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      SEQ_FSPATH: "/seq"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/seq
    networks:
      - learnwell-network

  api:
    build:
      context: ./src/LearnWell.Api
      dockerfile: Dockerfile
    container_name: learnwell_course_management-api
    ports:
      - "8080:8080"
    depends_on:
      - db
      - seq
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=LearnWellDB;Username=postgres;Password=MyStrongPassword123
      - Seq__ServerUrl=http://seq:80
    networks:
      - learnwell-network

volumes:
  pgdata:
  seqdata:

networks:
  learnwell-network:
