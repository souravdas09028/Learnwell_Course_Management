services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: LearnWellDB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - learnwell-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=LearnWellDB;Username=admin;Password=admin
    ports:
      - "5050:8888"
    depends_on:
      - db
    networks:
      - learnwell-network

volumes:
  pgdata:

networks:
  learnwell-network:
